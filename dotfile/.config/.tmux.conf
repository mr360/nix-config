# =========================
# Leader key 
# =========================
set-option -g prefix ` 
unbind-key C-b
bind-key ` send-prefix

set -g base-index 1

# =========================
# General
# =========================
setw -g mode-keys vi
set -g mouse on
set-option -g default-terminal screen-256color
set-option -g repeat-time 0

# Reload config
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# =========================
# Core bindings
# =========================
bind-key : command-prompt
bind-key r refresh-client
bind-key L clear-history

# Window navigation (kept)
#bind-key space next-window
#bind-key bspace previous-window
#bind-key enter next-layout

# =========================
# Your Shift+Space mappings
# =========================
# Splits
bind-key v split-window -h   # vertical split
bind-key c split-window -v   # horizontal split

# Window navigation (left/right)
bind-key n previous-window
bind-key m next-window

# Create window
bind-key b new-window

# Toggle zoom
bind-key t resize-pane -Z

# =========================
# Remove overlapping defaults
# =========================
#unbind-key c
#unbind-key t
unbind-key T

# =========================
# Pane movement (vim style)
# =========================
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# =========================
# Layouts
# =========================
bind-key = next-layout
bind-key - previous-layout
#bind-key = select-layout main-horizontal
#bind-key + select-layout main-vertical

set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80
set-window-option -g display-panes-time 1500
set-window-option -g window-status-current-style fg=magenta

# =========================
# Misc
# =========================
bind-key a last-pane
bind-key q display-panes

# =========================
# Resize panes (no prefix)
# =========================
bind -n C-Up    resize-pane -U 5
bind -n C-Down  resize-pane -D 5
bind -n C-Left  resize-pane -L 5
bind -n C-Right resize-pane -R 5

# =========================
# Copy / Paste
# =========================
bind-key s copy-mode
bind-key p run "tmux set-buffer \"$(xclip -o -sel clip)\"; tmux paste-buffer"

# Vim-style selection
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "if [ \"$(uname)\" = 'Darwin' ]; then pbcopy; else xclip -i -sel clip &>/dev/null; fi"

# Override Enter in copy mode
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "if [ \"$(uname)\" = 'Darwin' ]; then pbcopy; else xclip; fi"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "if [ \"$(uname)\" = 'Darwin' ]; then pbcopy; else xclip; fi"

# OSC52 clipboard support
set -g set-clipboard on
set -g allow-passthrough on

# =========================
# Status bar
# =========================
set -g status-position top
set-option -g status-interval 1
set-option -g status-style fg=black,bg=grey

set -g status-left '#[fg=blue]sqio.com #[default]'
set -g status-right '%a%l:%M:%S %p#[default] #[fg=blue]%Y-%m-%d'

set -g pane-active-border-style bg=grey,fg=grey
set -g pane-border-style 'fg=grey,bg=grey'

# =========================
# Activity monitoring
# =========================
setw -g monitor-activity on
set -g visual-activity on
